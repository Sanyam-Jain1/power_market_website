name: Refresh site data

# Rebuilds data/*.json from IEX prices once a day, after the Dhruva terminal
# (power_price_terminal) has committed the day's IEX results, and commits the
# result to master, which GitHub Pages serves.
on:
  schedule:
    - cron: "40 17 * * *"   # 23:10 IST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

env:
  BACKTESTER_REF: main      # power_market branch with bess.py (needs `ingest-csv` and the S1 rule)

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Sanyam-Jain1/power_price_terminal
          path: terminal
          sparse-checkout: data
      - uses: actions/checkout@v4
        with:
          repository: Sanyam-Jain1/power_market
          ref: ${{ env.BACKTESTER_REF }}
          path: backtester
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy pandas
      - name: Restore backtest cache
        uses: actions/cache@v4
        with:
          path: tools/.cache
          key: sim-${{ hashFiles('backtester/bess.py') }}-${{ github.run_id }}
          restore-keys: sim-${{ hashFiles('backtester/bess.py') }}-
      - name: Build the price database
        working-directory: backtester
        run: |
          python bess.py init
          python bess.py ingest raw/
          python bess.py ingest-csv ../terminal/data
      - name: Build site data
        run: python tools/build_data.py --backtester backtester --terminal terminal
      - name: Commit
        run: |
          git config user.name "zoltiq-bot"
          git config user.email "zoltiq-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: refresh $(date -u +%F)"
          git push
