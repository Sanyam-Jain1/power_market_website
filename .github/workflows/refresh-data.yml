name: Refresh site data

# Rebuilds data/*.json from IEX prices and commits it to master, which GitHub Pages serves.
# It fetches the latest IEX day-ahead, real-time, green and high-price day-ahead results itself
# (with the Dhruva terminal's fetcher), so it does not wait for the terminal's own daily commit.
# It runs every three hours: GitHub often starts scheduled jobs hours late, and a day's real-time
# results are only complete after midnight IST. A run commits only when the data changed.
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

env:
  BACKTESTER_REF: main      # power_market branch with bess.py

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Sanyam-Jain1/power_price_terminal
          path: terminal
      - uses: actions/checkout@v4
        with:
          repository: Sanyam-Jain1/power_market
          ref: ${{ env.BACKTESTER_REF }}
          path: backtester
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy pandas -r terminal/requirements.txt
      - name: Fetch the latest IEX results
        working-directory: terminal
        run: python -m dhruva -v ingest --only spot --from "$(date -u -d "$(date -u +%Y-%m-01) -1 month" +%F)"
      - name: Restore backtest cache
        uses: actions/cache@v4
        with:
          path: tools/.cache
          key: sim-${{ hashFiles('backtester/bess.py') }}-${{ github.run_id }}
          restore-keys: sim-${{ hashFiles('backtester/bess.py') }}-
      - name: Build the price database
        working-directory: backtester
        run: |
          python bess.py init
          python bess.py ingest raw/
          python bess.py ingest-csv ../terminal/data
      - name: Build site data
        run: python tools/build_data.py --backtester backtester --terminal terminal
      - name: Commit if the data changed
        run: |
          git config user.name "zoltiq-bot"
          git config user.email "zoltiq-bot@users.noreply.github.com"
          git add data
          # build_data.py leaves a file untouched when only its timestamp would change
          if git diff --cached --quiet; then
            echo "No new data"
          else
            git commit -m "data: refresh $(date -u +'%F %H:%M') UTC"
            git pull --rebase -q && git push
          fi
